<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Starlantern — the sky you can't see, lit up</title>
    <meta name="description" content="A phone overlay that locks to the real sky and shows you a Bortle-1 view — no matter where you actually are." />
    <!-- Analytics: privacy-friendly, cookie-free. Sign up at https://plausible.io
         and the data-domain below will start collecting. Self-hosted alternatives
         (Umami, PostHog Cloud) work the same way — swap the script src. -->
    <script defer data-domain="starlantern.app" src="https://plausible.io/js/script.outbound-links.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
